name: "Changelog aggregation"

# Collects pending entry files from changelogs/ into the "## main" section of
# CHANGELOG.md through an auto-generated pull request. Runs whenever a merged
# pull request touches changelogs/ — either by adding a new entry file, or by
# being the aggregation PR itself deleting collected ones.
#
# The aggregation branch is always rebuilt from the current main and
# force-pushed, so a single commit carries every entry still pending; while
# the aggregation PR stays open, newly merged entries are folded into it.
#
# Note: a pull request created with the default GITHUB_TOKEN does not trigger
# other workflows (CI, changelog verifier). If branch protection requires
# those checks, store a PAT with repo scope as the CHANGELOG_BOT_TOKEN secret
# and it will be used instead.

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main
    paths:
      - 'changelogs/**'
      - '!changelogs/README.md'
  workflow_dispatch:

concurrency:
  group: changelog-aggregation

jobs:
  aggregate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CHANGELOG_BOT_TOKEN || github.token }}
      BRANCH: changelog/collect-entries
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.CHANGELOG_BOT_TOKEN || github.token }}

      - name: Collect pending entries
        id: collect
        run: |
          count=$(ruby .github/scripts/aggregate_changelogs.rb)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Collected $count pending entry file(s)"

      - name: Force-push aggregation branch
        if: steps.collect.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add CHANGELOG.md changelogs
          git commit -m "Collect changelog entries into CHANGELOG.md"
          git push --force origin "$BRANCH"

      - name: Open pull request unless one exists
        if: steps.collect.outputs.count != '0'
        run: |
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$BRANCH" \
              --title "Collect changelog entries into CHANGELOG.md" \
              --body "$(printf 'Auto-generated by the changelog aggregation workflow.\n\nMoves the pending entry files from `changelogs/` into the `## main` section of `CHANGELOG.md` and deletes them. Entries merged while this PR is open are folded in by a force-push.')"
          fi

      - name: Delete stale aggregation branch
        if: steps.collect.outputs.count == '0'
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$BRANCH" || true
          fi
